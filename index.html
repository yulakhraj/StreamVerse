<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        let theme;
        try {
          theme = JSON.parse(
            localStorage.getItem("streamverse-preferences-v1") || "{}",
          ).state?.theme;
        } catch {
          /* Storage may be unavailable or contain an older value. */
        }
        document.documentElement.dataset.theme =
          theme === "light" || theme === "dark"
            ? theme
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="Discover open, public live television from around the world with StreamVerse."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StreamVerse — Your world, live</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
